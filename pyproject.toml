[project]
name = "neuroforge"
version = "0.1.0"
description = "Autonomous LLM System Evolution & Experimentation Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "numpy>=1.26",
    "scipy>=1.13",
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-api>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "passlib>=1.7",
    "redis>=5.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "httpx>=0.27",
    "types-PyYAML",
]

[project.scripts]
neuroforge = "neuroforge.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuroforge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends(...)-as-default is the framework's documented idiom, not a real bug.
"apps/api/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = false
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
