# Single-replica in-cluster Redis for demo purposes. Production: use a managed Redis with
# persistence/HA (ElastiCache, Memorystore, etc).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuroforge-redis
  namespace: neuroforge
spec:
  replicas: 1
  selector:
    matchLabels: { app: neuroforge-redis }
  template:
    metadata:
      labels: { app: neuroforge-redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: neuroforge-redis
  namespace: neuroforge
spec:
  selector: { app: neuroforge-redis }
  ports:
    - port: 6379
      targetPort: 6379
