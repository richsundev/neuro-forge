# A single-replica in-cluster Postgres for demo/eval purposes only. Production deployments should
# point NEUROFORGE_DATABASE_URL at a managed Postgres (RDS/Cloud SQL/etc.) instead — see
# docs/development.md "What's missing for real production."
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neuroforge-postgres
  namespace: neuroforge
spec:
  serviceName: neuroforge-postgres
  replicas: 1
  selector:
    matchLabels: { app: neuroforge-postgres }
  template:
    metadata:
      labels: { app: neuroforge-postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: neuroforge
            - name: POSTGRES_DB
              value: neuroforge
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: neuroforge-secrets, key: POSTGRES_PASSWORD }
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "neuroforge"] }
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: neuroforge-postgres
  namespace: neuroforge
spec:
  selector: { app: neuroforge-postgres }
  ports:
    - port: 5432
      targetPort: 5432
