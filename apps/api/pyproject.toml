[project]
name = "neuroforge-api"
version = "0.1.0"
description = "NeuroForge REST API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "neuroforge",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
    "passlib>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neuroforge_api"]

[tool.hatch.metadata]
allow-direct-references = true
